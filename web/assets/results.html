<section class="card">
  <p class="seed">
    Seed used: <code>{{SEED}}</code> - resubmit with this seed to reproduce
    these rows.
  </p>
  <button type="button" id="copy-all" class="copy-all">Copy all as JSON</button>
  <script type="application/json" id="results-json">
    {{JSON_PAYLOAD}}
  </script>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>First name</th>
          <th>Last name</th>
          <th>Gender</th>
          <th>Date of birth</th>
          <th>PESEL</th>
          <th>NIP</th>
        </tr>
      </thead>
      <tbody>
        {{ROWS}}
      </tbody>
    </table>
  </div>
</section>
