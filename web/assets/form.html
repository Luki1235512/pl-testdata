<form method="post" action="{{FORM_ACTION}}">
  <fieldset>
    <div class="field">
      <label for="gender">{{LABEL_GENDER}}</label>
      <select id="gender" name="gender">
        <option value="" {{GENDER_ANY_SELECTED}}>{{OPTION_ANY}}</option>
        <option value="male" {{GENDER_MALE_SELECTED}}>{{OPTION_MALE}}</option>
        <option value="female" {{GENDER_FEMALE_SELECTED}}>
          {{OPTION_FEMALE}}
        </option>
      </select>
    </div>

    <div class="field">
      <label for="count">{{LABEL_COUNT}}</label>
      <input
        type="number"
        id="count"
        name="count"
        min="1"
        max="50"
        value="{{COUNT_VALUE}}"
      />
    </div>

    <div class="field">
      <label for="min_date">{{LABEL_MIN_DATE}}</label>
      <input type="date" id="min_date" name="min_date" value="{{MIN_DATE}}" />
    </div>

    <div class="field">
      <label for="max_date">{{LABEL_MAX_DATE}}</label>
      <input type="date" id="max_date" name="max_date" value="{{MAX_DATE}}" />
    </div>

    <div class="field span-2">
      <label for="seed">{{LABEL_SEED}}</label>
      <input type="number" id="seed" name="seed" min="0" value="{{SEED}}" />
    </div>

    <button type="submit">{{BUTTON_GENERATE}}</button>
  </fieldset>
</form>
