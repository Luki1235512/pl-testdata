<form method="post" action="/generate">
  <fieldset>
    <legend>Generation options</legend>

    <div class="field">
      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="" {{GENDER_ANY_SELECTED}}>Any</option>
        <option value="male" {{GENDER_MALE_SELECTED}}>Male</option>
        <option value="female" {{GENDER_FEMALE_SELECTED}}>Female</option>
      </select>
    </div>

    <div class="field">
      <label for="count">How many</label>
      <input
        type="number"
        id="count"
        name="count"
        min="1"
        max="50"
        value="{{COUNT_VALUE}}"
      />
    </div>

    <div class="field">
      <label for="min_date">Born after</label>
      <input type="date" id="min_date" name="min_date" value="{{MIN_DATE}}" />
    </div>

    <div class="field">
      <label for="max_date">Born before</label>
      <input type="date" id="max_date" name="max_date" value="{{MAX_DATE}}" />
    </div>

    <div class="field span-2">
      <label for="seed"
        >Seed (optional - reuse it to reproduce the same output)</label
      >
      <input type="number" id="seed" name="seed" min="0" value="{{SEED}}" />
    </div>

    <button type="submit">Generate</button>
  </fieldset>
</form>
