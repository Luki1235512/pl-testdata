<!doctype html>
<html lang="{{HTML_LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 font-size=%2280%22><text y=%22.9em%22>🆔</text></svg>"
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{TAGLINE}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    {{HREFLANG_LINKS}}
    <meta
      name="google-site-verification"
      content="jV9oCptcx0sJnIjV_FkStKwwPBB3MSecjJephzhtL-8"
    />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{TAGLINE}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <div class="lang-switch">
          <a href="{{LANG_SWITCH_HREF}}">{{LANG_SWITCH_LABEL}}</a>
        </div>
        <h1>{{TITLE}}</h1>
        <p>{{TAGLINE}}</p>
      </div>
    </header>

    <main class="wrap">
      {{ERROR_HTML}}
      <section class="card">{{FORM_HTML}}</section>
      {{RESULTS_HTML}} {{FAQ_HTML}}
    </main>

    <footer class="wrap site-footer">
      <p>{{DISCLAIMER}}</p>
    </footer>

    <script>
      const copyAllBtn = document.getElementById("copy-all");
      if (copyAllBtn) {
        copyAllBtn.addEventListener("click", () => {
          const json = document.getElementById("results-json").textContent;
          navigator.clipboard.writeText(json);
          copyAllBtn.classList.add("copied");
          setTimeout(() => copyAllBtn.classList.remove("copied"), 1000);
        });
      }
    </script>
  </body>
</html>
