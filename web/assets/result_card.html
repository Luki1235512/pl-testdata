<li class="person-card">
  <dl class="field-grid">
    <div class="field-item">
      <dt>First name</dt>
      <dd>{{FIRST_NAME}}</dd>
    </div>
    <div class="field-item">
      <dt>Last name</dt>
      <dd>{{LAST_NAME}}</dd>
    </div>
    <div class="field-item">
      <dt>Gender</dt>
      <dd><span class="badge {{BADGE_CLASS}}">{{GENDER}}</span></dd>
    </div>
    <div class="field-item">
      <dt>Date of birth</dt>
      <dd>{{DATE_OF_BIRTH}}</dd>
    </div>
    <div class="field-item">
      <dt>PESEL</dt>
      <dd><code title="Double-click to select">{{PESEL}}</code></dd>
    </div>
    <div class="field-item">
      <dt>NIP</dt>
      <dd><code title="Double-click to select">{{NIP}}</code></dd>
    </div>
    <div class="field-item">
      <dt>City</dt>
      <dd>{{CITY}}</dd>
    </div>
    <div class="field-item">
      <dt>Postal code</dt>
      <dd><code title="Double-click to select">{{POSTAL_CODE}}</code></dd>
    </div>
    <div class="field-item">
      <dt>Phone</dt>
      <dd><code title="Double-click to select">{{PHONE}}</code></dd>
    </div>
    <div class="field-item field-item--wide">
      <dt>Email</dt>
      <dd><code title="Double-click to select">{{EMAIL}}</code></dd>
    </div>
  </dl>
</li>
